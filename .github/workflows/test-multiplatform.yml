name: Multiplatform Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install ffmpeg on Windows
      if: runner.os == 'Windows'
      run: |
        choco install ffmpeg -y
        echo "C:\ProgramData\chocolatey\bin" >> $GITHUB_PATH
      shell: powershell

    - name: Install ffmpeg on macOS
      if: runner.os == 'macOS'
      run: |
        brew install ffmpeg

    - name: Install ffmpeg on Linux
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Verify ffmpeg installation
      run: ffmpeg -version || echo "Warning: ffmpeg not found in PATH"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run tests
      run: |
        pytest tests/ -v

    - name: Verify app can start (basic check)
      run: |
        python -c "from gui.main_window import MainWindow; print('✓ App imports successfully')"

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: All tests passed
        if: ${{ success() }}
        run: echo "✓ All tests passed on all platforms and Python versions"

      - name: Some tests failed
        if: ${{ failure() }}
        run: |
          echo "✗ Some tests failed"
          exit 1
