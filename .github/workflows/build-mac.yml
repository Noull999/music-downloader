name: Build macOS

# Arma MusicDownloader.app (en un .zip) en un Mac de GitHub: no hace falta
# tener un Mac. Se corre a mano desde la pestaña Actions ("Run workflow") o
# al subir una etiqueta v* (por ejemplo v1.0.0), que además la publica en
# Releases para que se pueda descargar con un link.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # para publicar en Releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon (M1/M2/M3...)
            nombre: apple-silicon
          - os: macos-15-intel    # Mac con procesador Intel
            nombre: intel
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.nombre }}" = "intel" ]; then
            # Mac Intel = Macs viejos: versiones que aun soportan macOS 10.13+
            pip install -r requirements-build.txt -c constraints-mac-intel.txt
          else
            pip install -r requirements-build.txt
          fi

      - name: Tests
        run: |
          pip install pytest
          pytest tests -q -x --ignore=tests/test_id3_version.py

      - name: Construir la app
        run: python scripts/build.py --clean

      - name: Version minima de macOS que exige la app
        run: |
          # macOS minimo (minos) de cada binario de la app. Se muestran los que
          # pasan de 10.15 (el tope de un MacBook de 2012) y el peor de todos.
          find dist/MusicDownloader.app -type f | while read f; do
            file "$f" | grep -q "Mach-O" || continue
            v=$(otool -l "$f" 2>/dev/null | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; b=0} /LC_VERSION_MIN_MACOSX/{m=1} m&&/version/{print $2; m=0}' | head -1)
            [ -n "$v" ] && echo "$v $f"
          done > /tmp/minos.txt
          echo "== Binarios que exigen mas que macOS 10.15:"
          awk '{split($1,a,"."); if (a[1]+0>10 || (a[1]+0==10 && a[2]+0>15)) print}' /tmp/minos.txt | sed 's#dist/MusicDownloader.app/Contents/##' | sort -u | head -40
          echo "== Peor caso:"; sort -t. -k1,1n -k2,2n /tmp/minos.txt | tail -1

      - name: Prueba de arranque (como al abrirla desde el Finder)
        run: |
          # El Finder abre las apps con la carpeta actual en "/", que en macOS
          # es de solo lectura. Se arranca igual y se mira si la app sigue viva.
          APP="$PWD/dist/MusicDownloader.app/Contents/MacOS/MusicDownloader"
          cd /
          "$APP" > /tmp/arranque.txt 2>&1 &
          PID=$!
          for i in $(seq 1 45); do sleep 1; kill -0 $PID 2>/dev/null || break; done
          if kill -0 $PID 2>/dev/null; then
            echo "OK: la app sigue abierta despues de 45 s"
            kill $PID || true
            tail -15 /tmp/arranque.txt
          else
            echo "FALLA: la app se cerro sola al arrancar. Salida:"
            cat /tmp/arranque.txt
            exit 1
          fi

      - name: Renombrar
        run: mv dist/MusicDownloader-mac.zip dist/MusicDownloader-mac-${{ matrix.nombre }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MusicDownloader-mac-${{ matrix.nombre }}
          path: dist/MusicDownloader-mac-${{ matrix.nombre }}.zip

      - name: Publicar en Releases (solo con etiqueta)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MusicDownloader-mac-${{ matrix.nombre }}.zip
