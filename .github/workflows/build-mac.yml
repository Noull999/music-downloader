name: Build macOS

# Arma MusicDownloader.app (en un .zip) en un Mac de GitHub: no hace falta
# tener un Mac. Se corre a mano desde la pestaña Actions ("Run workflow") o
# al subir una etiqueta v* (por ejemplo v1.0.0), que además la publica en
# Releases para que se pueda descargar con un link.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # para publicar en Releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon (M1/M2/M3...)
            nombre: apple-silicon
          - os: macos-15-intel    # Mac con procesador Intel
            nombre: intel
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Tests
        run: |
          pip install pytest
          pytest tests -q -x --ignore=tests/test_id3_version.py

      - name: Construir la app
        run: python scripts/build.py --clean

      - name: Version minima de macOS que exige la app
        run: |
          # Lista el macOS minimo de cada binario de la app (LC_BUILD_VERSION /
          # LC_VERSION_MIN) y muestra el mas exigente: es la version mas vieja de
          # macOS en la que puede abrir.
          find dist/MusicDownloader.app -type f \( -name "*.so" -o -name "*.dylib" -o -perm -u+x \) 2>/dev/null | while read f; do
            file "$f" | grep -q "Mach-O" || continue
            v=$(otool -l "$f" 2>/dev/null | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; b=0} /LC_VERSION_MIN_MACOSX/{m=1} m&&/version/{print $2; m=0}' | head -1)
            [ -n "$v" ] && echo "$v $f"
          done | sort -t. -k1,1n -k2,2n | tail -15

      - name: Renombrar
        run: mv dist/MusicDownloader-mac.zip dist/MusicDownloader-mac-${{ matrix.nombre }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MusicDownloader-mac-${{ matrix.nombre }}
          path: dist/MusicDownloader-mac-${{ matrix.nombre }}.zip

      - name: Publicar en Releases (solo con etiqueta)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MusicDownloader-mac-${{ matrix.nombre }}.zip
